<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIA Time-Series Data - Interactive Simulator</title>
    <style>
        :root {
            --primary: #10B981;
            --primary-dark: #059669;
            --secondary: #3B82F6;
            --bg: #0f172a;
            --bg-card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

        /* Navigation */
        .nav-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .nav-home:hover { color: var(--primary); }

        /* Hero */
        .hero {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }
        .hero h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero p { color: var(--text-muted); font-size: 1rem; }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab {
            padding: 12px 24px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .tab.active {
            background: var(--primary);
            border-color: var(--primary);
        }
        .tab:hover { border-color: var(--primary); }

        /* Content Frame */
        iframe {
            width: 100%;
            min-height: 800px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--bg-card);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="nav-home">⏱️ Time-Series Data Standard</a>

        <div class="hero">
            <h1>Interactive Simulator</h1>
            <p>Explore time-series data concepts with hands-on examples</p>
        </div>

        <div class="tabs">
            <a href="overview.html" class="tab active" data-tab="overview">📖 Overview</a>
            <a href="demo.html" class="tab" data-tab="demo">🎮 Demo</a>
            <a href="api.html" class="tab" data-tab="api">⚙️ API</a>
            <a href="examples.html" class="tab" data-tab="examples">💡 Examples</a>
            <a href="resources.html" class="tab" data-tab="resources">📚 Resources</a>
        </div>

        <iframe id="content-frame" src="overview.html"></iframe>
    </div>

    <script>
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('content-frame').src = tab.href;
            });
        });
    </script>
</body>
</html>
