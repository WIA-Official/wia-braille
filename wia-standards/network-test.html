        /* Cyberpunk Grid Background */
        .cyber-bg {
            position: fixed;

            left: 0;
            width: 100%;
            height: 100%;

                linear-gradient(rgba(0,255,255,0.03) 1px, transparent 1px),
                radial-gradient(ellipse at 50% 0%, rgba(0,255,255,0.1) 0%, transparent 50%);
            background-size: 50px 50px, 50px 50px, 100% 100%;
            pointer-events: none;
            z-index: 0;
        }
        
        /* Scanline Effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0,0,0,0.1) 0px,
                rgba(0,0,0,0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
            opacity: 0.3;
        }
        
        .container {
            position: relative;
            z-index: 1;
            max-width: 100%;
            padding: 20px;
        }
        
        /* Header */
        .header {
            text-align: center;
            padding: 30px 20px;
            border-bottom: 1px solid rgba(0,255,255,0.2);
            margin-bottom: 20px;
        }
        
        .logo {
            font-family: 'Orbitron', monospace;
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffff 0%, #ff00ff 50%, #00ffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0,255,255,0.5);
            letter-spacing: 8px;
            animation: glitch 3s infinite;
        }
        
        @keyframes glitch {
            0%, 90%, 100% { transform: translateX(0); }
            92% { transform: translateX(-2px); }
            94% { transform: translateX(2px); }
            96% { transform: translateX(-1px); }
            98% { transform: translateX(1px); }
        }
        
        .tagline {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            color: #ffd700;
            margin-top: 15px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        
        .subtitle {
            color: #888;
            margin-top: 10px;
            font-size: 1rem;
        }
        
        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 25px;
            background: linear-gradient(135deg, rgba(0,255,255,0.05) 0%, rgba(255,0,255,0.05) 100%);
            border: 1px solid rgba(0,255,255,0.2);
            border-radius: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00ffff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .stat-value.live {
            background: linear-gradient(135deg, #00ff88, #88ff00);
            -webkit-background-clip: text;
        }
        
        .stat-value.coming {
            background: linear-gradient(135deg, #ff9500, #ff00ff);
            -webkit-background-clip: text;
        }
        
        .stat-label {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
        }
        
        /* Network Container */
        .network-section {
            position: relative;
            background: rgba(10,10,20,0.8);
            border: 1px solid rgba(0,255,255,0.3);
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .network-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: linear-gradient(90deg, rgba(0,255,255,0.1) 0%, rgba(255,0,255,0.1) 100%);
            border-bottom: 1px solid rgba(0,255,255,0.2);
        }
        
        .network-title {
            font-family: 'Orbitron', monospace;
            font-size: 1.2rem;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        
        .network-controls {
            display: flex;
            gap: 10px;
        }
        
        .control-btn {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid rgba(0,255,255,0.5);
            color: #00ffff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .control-btn:hover {
            background: rgba(0,255,255,0.2);
            box-shadow: 0 0 15px rgba(0,255,255,0.3);
        }
        
        #network-container {
            width: 100%;
            height: 700px;
            position: relative;
        }
        
        #network-svg {
            width: 100%;
            height: 100%;
        }

            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 20px;
            flex-wrap: wrap;
            border-top: 1px solid rgba(0,255,255,0.2);
            background: rgba(0,0,0,0.3);

            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            box-shadow: 0 0 10px currentColor;
        }
        
        /* Tooltip */
        .tooltip {
            position: absolute;
            background: rgba(10,10,30,0.95);
            border: 1px solid #00ffff;
            border-radius: 8px;
            padding: 15px;
            pointer-events: none;

            z-index: 100;

            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            color: #00ffff;
            margin-bottom: 10px;

        .tooltip-stats {

        }

            { source: "MED", target: "BIO" }, { source: "MED", target: "AUG" },
            { source: "BIO", target: "CRYO" }, { source: "SEMI", target: "QUA" },
            { source: "SEC", target: "COMM" }, { source: "DATA", target: "AI" },
            { source: "LANG", target: "AI" },
            // World 내부
            { source: "SPACE", target: "ENE" }, { source: "SPACE", target: "CONTACT" },
            { source: "ENE", target: "OCEAN" }, { source: "TIME", target: "QUA" },
            { source: "HERITAGE", target: "LANG" },
            // Industry 내부
            { source: "AUTO", target: "CITY" }, { source: "FIN", target: "SEC" },
            { source: "AGRI", target: "ENE" }, { source: "EDU", target: "AI" },
            { source: "SOC", target: "LEG" }, { source: "PET", target: "MED" },
            { source: "ART", target: "AI" }, { source: "LEGAL", target: "SOC" },
            // Cross-level
            { source: "AAC", target: "AI" }, { source: "MENTAL", target: "AI" },
            { source: "ROB", target: "AUTO" }, { source: "CITY", target: "ENE" },
            { source: "CHILD", target: "EDU" }, { source: "SENIOR", target: "MED" }
        ];
        
        const levelColors = {
            humanity: "#00ff88",
            tech: "#00d4ff", 
            world: "#bf00ff",
            industry: "#ff9500"
        };
        
        // SVG 설정
        const container = document.getElementById("network-container");
        const svg = d3.select("#network-svg");
        const width = container.clientWidth;
        const height = container.clientHeight;
        
        svg.attr("viewBox", `0 0 ${width} ${height}`);
        
        // 그라데이션 정의
        const defs = svg.append("defs");
        
        Object.entries(levelColors).forEach(([level, color]) => {
            const gradient = defs.append("linearGradient")
                .attr("id", `gradient-${level}`)
                .attr("x1", "0%").attr("y1", "0%")
                .attr("x2", "100%").attr("y2", "100%");
            gradient.append("stop").attr("offset", "0%").attr("stop-color", color);
            gradient.append("stop").attr("offset", "100%").attr("stop-color", d3.color(color).darker(0.5));
        });
        
        // 글로우 필터
        const filter = defs.append("filter").attr("id", "glow");
        filter.append("feGaussianBlur").attr("stdDeviation", "3").attr("result", "coloredBlur");
        const feMerge = filter.append("feMerge");
        feMerge.append("feMergeNode").attr("in", "coloredBlur");
        feMerge.append("feMergeNode").attr("in", "SourceGraphic");
        
        // Force 시뮬레이션
        const simulation = d3.forceSimulation(domains)
            .force("link", d3.forceLink(links).id(d => d.id).distance(180).strength(0.3))
            .force("charge", d3.forceManyBody().strength(-800))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(90))
            .force("x", d3.forceX(width / 2).strength(0.05))
            .force("y", d3.forceY(height / 2).strength(0.05))
            .alphaDecay(0.01);
        
        // 링크 그리기
        const link = svg.append("g")
            .selectAll("line")
            .data(links)
            .enter().append("line")
            .attr("stroke", "rgba(0,255,255,0.15)")
            .attr("stroke-width", 1);
        
        // 노드 그룹
        const node = svg.append("g")
            .selectAll("g")
            .data(domains)
            .enter().append("g")
            .attr("class", "node")
            .style("cursor", "pointer")
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));
        
        // 노드 사각형
        node.append("rect")
            .attr("width", 140)
            .attr("height", 70)
            .attr("x", -70)
            .attr("y", -35)
            .attr("rx", 10)
            .attr("fill", d => `url(#gradient-${d.level})`)
            .attr("fill-opacity", d => d.live > 0 ? 0.9 : 0.4)
            .attr("stroke", d => levelColors[d.level])
            .attr("stroke-width", d => d.live > 0 ? 2 : 1)
            .attr("filter", d => d.live > 0 ? "url(#glow)" : "none");
        
        // 이모지
        node.append("text")
            .attr("y", -8)
            .attr("text-anchor", "middle")
            .attr("font-size", "22px")
            .text(d => d.emoji);
        
        // 이름
        node.append("text")
            .attr("y", 12)
            .attr("text-anchor", "middle")
            .attr("fill", "#fff")
            .attr("font-family", "'Orbitron', monospace")
            .attr("font-size", "11px")
            .attr("font-weight", "bold")
            .text(d => d.name);
        
        // 카운트 배지
        node.append("text")
            .attr("y", 28)
            .attr("text-anchor", "middle")
            .attr("fill", d => d.live > 0 ? "#00ff88" : "#888")
            .attr("font-size", "10px")
            .text(d => d.live > 0 ? `${d.live}/${d.count} LIVE` : `${d.count} COMING`);
        
        // 툴팁
        const tooltip = document.getElementById("tooltip");
        
        node.on("mouseover", function(event, d) {
            // 하이라이트
            link.attr("stroke", l => 
                l.source.id === d.id || l.target.id === d.id 
                    ? levelColors[d.level] 
                    : "rgba(0,255,255,0.1)"
            ).attr("stroke-width", l =>
                l.source.id === d.id || l.target.id === d.id ? 2 : 1
            );
            
            // 툴팁
            tooltip.innerHTML = `
                <div class="tooltip-title">${d.emoji} ${d.name}</div>
                <div class="tooltip-stats">
                    <div class="tooltip-stat">
                        <div class="tooltip-stat-value" style="color: ${levelColors[d.level]}">${d.count}</div>
                        <div class="tooltip-stat-label">Total</div>
                    </div>
                    <div class="tooltip-stat">
                        <div class="tooltip-stat-value" style="color: #00ff88">${d.live}</div>
                        <div class="tooltip-stat-label">Live</div>
                    </div>
                    <div class="tooltip-stat">
                        <div class="tooltip-stat-value" style="color: #ff9500">${d.count - d.live}</div>
                        <div class="tooltip-stat-label">Coming</div>
                    </div>
                </div>
                <div class="tooltip-standards">${d.standards.join(" · ")}</div>
            `;
            tooltip.style.left = (event.pageX + 15) + "px";
            tooltip.style.top = (event.pageY - 10) + "px";
            tooltip.classList.add("visible");
        })
        .on("mouseout", function() {
            link.attr("stroke", "rgba(0,255,255,0.15)").attr("stroke-width", 1);
            tooltip.classList.remove("visible");
        })
        .on("click", function(event, d) {
            if (d.live > 0) {
                window.open(d.url, '_blank');
            }
        });
        
        // 시뮬레이션 tick
        simulation.on("tick", () => {
            // 경계 제한
            domains.forEach(d => {
                d.x = Math.max(80, Math.min(width - 80, d.x));
                d.y = Math.max(45, Math.min(height - 45, d.y));
            });
            
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);
            
            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });
        
        // 드래그 함수
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }
        
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        
        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
        
        // 컨트롤 함수
        let linksVisible = true;
        
        function resetView() {
            simulation.alpha(1).restart();
        }
        
        function toggleLinks() {
            linksVisible = !linksVisible;
            link.attr("opacity", linksVisible ? 1 : 0);
        }
        
        // 반응형
        window.addEventListener("resize", () => {
            const newWidth = container.clientWidth;
            const newHeight = container.clientHeight;
            svg.attr("viewBox", `0 0 ${newWidth} ${newHeight}`);
            simulation.force("center", d3.forceCenter(newWidth / 2, newHeight / 2));
            simulation.alpha(0.3).restart();
        });
    </script>
</body>
</html>
