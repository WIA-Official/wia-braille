<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초전도 시스템</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #8B5CF6;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --border: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Georgia, 'Times New Roman', serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
            padding: 2rem;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 3rem;
        }
        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 1rem;
            border-bottom: 3px solid var(--primary);
            padding-bottom: 1rem;
        }
        h2 {
            color: var(--primary);
            font-size: 1.8rem;
            margin: 2rem 0 1rem 0;
        }
        h3 {
            color: var(--text);
            font-size: 1.3rem;
            margin: 1.5rem 0 0.75rem 0;
        }
        p {
            margin-bottom: 1rem;
            text-align: justify;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            background: var(--bg);
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border: 1px solid var(--border);
        }
        th {
            background: var(--primary);
            color: white;
            font-weight: 600;
        }
        .summary {
            background: var(--bg);
            border-left: 4px solid var(--primary);
            padding: 1.5rem;
            margin: 2rem 0;
        }
        .summary h3 {
            color: var(--primary);
            margin-top: 0;
        }
        ul, ol {
            margin: 1rem 0 1rem 2rem;
        }
        li {
            margin-bottom: 0.5rem;
        }
        .nav-links {
            display: flex;
            justify-content: space-between;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }
        .nav-links a {
            color: var(--primary);
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border: 1px solid var(--primary);
            border-radius: 6px;
            transition: all 0.3s;
        }
        .nav-links a:hover {
            background: var(--primary);
            color: white;
        }
        code {
            background: var(--bg);
            color: var(--primary);
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
        pre {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            overflow-x: auto;
            margin: 1.5rem 0;
        }
        .callout {
            background: rgba(139, 92, 246, 0.1);
            border-left: 4px solid var(--primary);
            padding: 1rem 1.5rem;
            margin: 1.5rem 0;
        }
        .questions {
            background: var(--bg);
            padding: 1.5rem;
            border-radius: 8px;
            margin: 2rem 0;
        }
        .questions ol {
            margin-left: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>초전도 시스템 - eBook 목차</h1>
        
        <p>이 전자책은 WIA 표준의 포괄적인 기술 가이드입니다.</p>

            <li><a href="chapter-07.html">제 7</a></li>
            <li><a href="chapter-08.html">제 8</a></li>
        </ul>
        
        <div class="callout">
            <strong>弘益人間 (Benefit All Humanity)</strong><br>
            This standard aims to advance technology for the benefit of all humanity.
        </div>
    </div>
</body>
</html>
