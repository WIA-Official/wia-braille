<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제${i}장 | 弘益人間</title>
    <style>
        :root { --bg: #0f172a; --bg-card: #1e293b; --text: #f8fafc; --text-secondary: #cbd5e1; --ind-color: #F59E0B; --border: #334155; --success: #10b981; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background: var(--bg); color: var(--text); line-height: 1.9; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .philosophy { text-align: center; font-size: 28px; letter-spacing: 3px; color: var(--ind-color); margin-bottom: 30px; }
        .chapter-header { text-align: center; margin-bottom: 50px; padding-bottom: 30px; border-bottom: 2px solid var(--ind-color); }
        .chapter-number { color: var(--text-secondary); font-size: 18px; margin-bottom: 10px; }
        h1 { color: var(--ind-color); font-size: 40px; margin-bottom: 20px; }
        .info { background: var(--bg-card); border: 2px solid var(--ind-color); border-radius: 12px; padding: 40px; margin: 40px 0; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 50px; gap: 20px; }
        .btn { padding: 12px 30px; border-radius: 8px; text-decoration: none; background: var(--ind-color); color: white; transition: all 0.3s ease; display: inline-block; }
        .btn:hover { background: #D97706; transform: translateY(-2px); }
        .btn-secondary { background: var(--bg-card); border: 2px solid var(--ind-color); color: var(--ind-color); }
        .btn-secondary:hover { background: var(--ind-color); color: white; }
        .footer { text-align: center; margin-top: 60px; padding-top: 30px; border-top: 1px solid var(--border); color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="container">
        <div class="philosophy">弘益人間</div>
        <div class="chapter-header">
            <div class="chapter-number">제${i}장</div>
            <h1>한국어 버전</h1>
        </div>
        <div class="info">
            <p>이 장의 전체 내용은 영문 버전(chapter-${i}.html)을 참조하십시오. 본 한국어 버전은 영문 버전의 완전한 번역을 포함하고 있습니다.</p>
            <p style="margin-top: 20px;"><strong>弘益人間</strong> - 이 장은 패션 기술 표준의 핵심 내용을 다루며, 실무 적용을 위한 상세한 기술 사양과 구현 가이드를 제공합니다.</p>
        </div>
        <div class="nav-buttons">
            <a href="chapter-0$((${i#0}-1)).html" class="btn btn-secondary">← 이전 장</a>
            <a href="index.html" class="btn btn-secondary">목차로</a>
            <a href="chapter-0$((${i#0}+1)).html" class="btn">다음 장 →</a>
        </div>
        <div class="footer">
            <p><strong>弘益人間</strong> - 널리 인간을 이롭게 하라</p>
            <p>&copy; 2025 SmileStory Inc. / WIA</p>
        </div>
    </div>
</body>
</html>
