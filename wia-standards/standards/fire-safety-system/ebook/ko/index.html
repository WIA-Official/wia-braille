<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화재 안전 시스템 표준 - 전자책 목차</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --primary: #8B5CF6;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --border: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
            padding: 2rem;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 3rem;
        }
        h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: var(--text-dim);
            margin-bottom: 3rem;
            font-size: 1.1rem;
        }
        .toc {
            list-style: none;
        }
        .toc li {
            margin-bottom: 1.5rem;
        }
        .toc a {
            color: var(--text);
            text-decoration: none;
            display: flex;
            align-items: center;
            padding: 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: all 0.3s;
        }
        .toc a:hover {
            border-color: var(--primary);
            background: rgba(239, 68, 68, 0.1);
            transform: translateX(10px);
        }
        .chapter-num {
            display: inline-block;
            background: var(--primary);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            text-align: center;
            line-height: 50px;
            font-weight: bold;
            margin-right: 1.5rem;
            flex-shrink: 0;
        }
        .chapter-title {
            flex-grow: 1;
            font-weight: 600;
        }
        .philosophy {
            text-align: center;
            color: var(--primary);
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }
    </style>
</head>

    </div>
