<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIA-EDU-022 e스포츠 교육 - 챕터</title>
    <style>
        :root {
            --primary: #10B981;
            --bg: #0f172a;
            --bg-card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 60px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--primary), #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        h2 {
            color: var(--primary);
            font-size: 1.8rem;
            margin: 40px 0 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
        }
        p, li {
            margin: 15px 0;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
        .nav-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid var(--border);
        }
        .nav-footer a {
            color: var(--primary);
            text-decoration: none;
            padding: 12px 24px;
            border: 2px solid var(--primary);
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 e스포츠 교육 표준</h1>
        <h2>WIA-EDU-022 - 완벽 가이드</h2>
        <p>이 챕터는 교육 e스포츠 프로그램의 핵심 개념을 다룹니다.</p>
        <p>영어 버전의 완전한 콘텐츠는 대응하는 영어 챕터를 참조하십시오.</p>
        <div class="nav-footer">
            <a href="index.html">← 목차로</a>
        </div>
    </div>
</body>
</html>
