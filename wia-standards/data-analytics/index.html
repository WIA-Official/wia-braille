<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIA-DATA-012: Data Analytics Standard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            line-height: 1.6;
        }

        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-bottom: 3px solid #10B981;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            color: #10B981;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .header p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid #1e293b;
            flex-wrap: wrap;
        }

        .tab {
            background: #1e293b;
            color: #94a3b8;
            border: none;
            padding: 1rem 2rem;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            border: 2px solid transparent;
        }

        .tab:hover {
            background: #334155;
            color: #10B981;
        }

        .tab.active {
            background: #10B981;
            color: #0f172a;
            font-weight: bold;
            border-color: #10B981;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.5s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #10B981;
            margin-bottom: 1rem;
            font-size: 1.8rem;
        }

        .card h3 {
            color: #10B981;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
            font-size: 1.3rem;
        }

        .card ul {
            list-style-position: inside;
            margin-left: 1rem;
        }

        .card li {
            margin-bottom: 0.5rem;
            color: #cbd5e1;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .feature-card {
            background: #334155;
            padding: 1.5rem;
            border-radius: 8px;
            border-left: 4px solid #10B981;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(16, 185, 129, 0.2);
        }

        .feature-card h4 {
            color: #10B981;
            margin-bottom: 0.5rem;
        }

        .code-block {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 1.5rem;
            overflow-x: auto;
            margin: 1rem 0;
            font-family: 'Courier New', monospace;
            color: #10B981;
        }

        .btn {
            background: #10B981;
            color: #0f172a;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            margin: 0.5rem 0.5rem 0.5rem 0;
            display: inline-block;
        }

        .btn:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(16, 185, 129, 0.3);
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-left: 0.5rem;
        }

        .status-active {
            background: #10B981;
            color: #0f172a;
        }

        .status-beta {
            background: #f59e0b;
            color: #0f172a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }

        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid #334155;
        }

        th {
            background: #334155;
            color: #10B981;
            font-weight: bold;
        }

        tr:hover {
            background: #334155;
        }

        .footer {
            text-align: center;
            padding: 2rem;
            color: #64748b;
            border-top: 2px solid #1e293b;
            margin-top: 3rem;
        }

        .footer a {
            color: #10B981;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>WIA-DATA-012: Data Analytics</h1>
        <p>Comprehensive Data Analytics Framework for Intelligent Decision Making</p>
        <p style="color: #10B981; margin-top: 0.5rem;">弘益人間 (홍익인간) · Benefit All Humanity</p>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="openTab(event, 'overview')">Overview</button>
            <button class="tab" onclick="openTab(event, 'demo')">Live Demo</button>
            <button class="tab" onclick="openTab(event, 'api')">API Reference</button>
            <button class="tab" onclick="openTab(event, 'examples')">Examples</button>
            <button class="tab" onclick="openTab(event, 'resources')">Resources</button>
        </div>

        <div id="overview" class="tab-content active">
            <iframe src="simulator/overview.html" style="width: 100%; height: 800px; border: none; border-radius: 12px; background: #1e293b;"></iframe>
        </div>

        <div id="demo" class="tab-content">
            <iframe src="simulator/demo.html" style="width: 100%; height: 800px; border: none; border-radius: 12px; background: #1e293b;"></iframe>
        </div>

        <div id="api" class="tab-content">
            <iframe src="simulator/api.html" style="width: 100%; height: 800px; border: none; border-radius: 12px; background: #1e293b;"></iframe>
        </div>

        <div id="examples" class="tab-content">
            <iframe src="simulator/examples.html" style="width: 100%; height: 800px; border: none; border-radius: 12px; background: #1e293b;"></iframe>
        </div>

        <div id="resources" class="tab-content">
            <iframe src="simulator/resources.html" style="width: 100%; height: 800px; border: none; border-radius: 12px; background: #1e293b;"></iframe>
        </div>
    </div>

    <div class="footer">
        <p>© 2025 SmileStory Inc. / WIA · <a href="https://github.com/WIA-Official">GitHub</a></p>
        <p style="margin-top: 0.5rem;">Part of the WIA Standards Family</p>
    </div>

    <script>
        function openTab(evt, tabName) {
            const tabContents = document.getElementsByClassName('tab-content');
            for (let i = 0; i < tabContents.length; i++) {
                tabContents[i].classList.remove('active');
            }

            const tabs = document.getElementsByClassName('tab');
            for (let i = 0; i < tabs.length; i++) {
                tabs[i].classList.remove('active');
            }

            document.getElementById(tabName).classList.add('active');
            evt.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
