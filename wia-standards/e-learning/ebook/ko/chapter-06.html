        <h1>6장</h1>
        <h2>인증 및 블록체인 자격증명</h2>
        <p>검증 가능한 디지털 인증서는 학습자가 고용주와 기관에 자신의 성취를 증명할 수 있게 합니다.</p>
        <h3>인증서 유형</h3>
        <ul>
            <li>강좌 완료 인증서</li>
            <li>전문 자격증 (업계 인증)</li>
            <li>마이크로 자격증명 및 디지털 배지</li>
        </ul>
        <h3>블록체인 기반 자격증명</h3>
        <p>블록체인 기술은 인증서가 변조 방지되고 전 세계적으로 검증 가능하도록 보장합니다.</p>
        <ul>
            <li>불변성: 인증서 위조 불가</li>
            <li>탈중앙화: 단일 실패 지점 없음</li>
            <li>즉시 검증: 고용주가 수 초 내에 자격증명 검증</li>
        </ul>
