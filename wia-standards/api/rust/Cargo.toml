[package]
name = "wia-grand-challenges"
version = "1.0.0"
edition = "2021"
authors = ["WIA International"]
description = "WIA Grand Challenges SDK - 33개 인류 난제 해결을 위한 표준 API (Rust/Axum)"
license = "MIT"
repository = "https://github.com/WIA-Official/wia-standards"
keywords = ["wia", "healthcare", "grand-challenges", "hongik-ingan", "axum"]

[dependencies]
axum = "0.7"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-test = "0.4"
